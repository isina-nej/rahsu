[project]
name = "rahsu"
version = "0.1.0"
description = "Tehran Pride fuel estimation research web app"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<4",
  "django-cors-headers>=4.7,<5",
  "drf-spectacular>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
  "httpx>=0.28,<1",
  "structlog>=25,<27",
  "prometheus-client>=0.21,<1",
  "celery[redis]>=5.5,<6",
  "redis>=5.2,<7",
  "shapely>=2.0,<3",
  "pyproj>=3.7,<4",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-django>=0.51b0,<1",
]

[project.optional-dependencies]
science = ["numpy>=2.0,<3"]
dev = [
 "pytest>=8,<10", "pytest-django>=4.10,<5", "pytest-cov>=6,<8",
 "ruff>=0.11,<1", "mypy>=1.15,<2", "hypothesis>=6,<7",
 "django-stubs>=5.1,<6", "types-redis>=4,<5"
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/domain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "domain"]
