name: rahsu
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rahsu}
      POSTGRES_USER: ${POSTGRES_USER:-rahsu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 4s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server","--save","60","1","--appendonly","yes"]
    volumes: [redisdata:/data]
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      OSRM_BASE_URL: http://osrm:5000
      LOKI_BASE_URL: http://loki:3100
      PROMETHEUS_BASE_URL: http://prometheus:9090
      TEMPO_BASE_URL: http://tempo:3200
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./data/osm:/data/osm:ro"]
    ports: ["127.0.0.1:8000:8000"]
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: ["celery","-A","config","worker","--loglevel=INFO","--concurrency=1"]
    restart: unless-stopped
    env_file: [.env]
    environment: {POSTGRES_HOST: db, REDIS_URL: "redis://redis:6379/0"}
    depends_on: [db, redis]
  web:
    build: {context: ./frontend}
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:8080:80"]
  osrm:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v26.10.0-debian@sha256:55dbfd47d984c2cacd64e32901b4321c86b5ec761438e69aa053dc78698a786f}
    profiles: [routing]
    command: ["osrm-routed","--algorithm","mld","/data/tehran.osrm"]
    volumes: ["./data/osrm:/data:ro"]
  loki:
    image: grafana/loki:3.3.2
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["./infra/loki/loki.yaml:/etc/loki/local-config.yaml:ro","lokidata:/loki"]
  alloy:
    image: grafana/alloy:v1.6.1
    profiles: [monitoring]
    command: ["run","/etc/alloy/config.alloy"]
    volumes: ["./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro","/var/run/docker.sock:/var/run/docker.sock:ro"]
  tempo:
    image: grafana/tempo:2.7.0
    profiles: [monitoring]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro","tempodata:/var/tempo"]
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro","./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro","promdata:/prometheus"]
  grafana:
    image: grafana/grafana:11.5.2
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["./infra/grafana/provisioning:/etc/grafana/provisioning:ro","./infra/grafana/dashboards:/etc/grafana/dashboards:ro","grafanadata:/var/lib/grafana"]
volumes:
  dbdata: {}
  redisdata: {}
  lokidata: {}
  tempodata: {}
  promdata: {}
  grafanadata: {}
