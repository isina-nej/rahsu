groups:
  - name: rahsu-api
    rules:
      - alert: RahsuApiUnavailable
        expr: up{job="api-health"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Rahsu API exporter unreachable
      - alert: RahsuHighErrorRate
        expr: |
          (sum(rate(rahsu_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(rahsu_http_requests_total[5m])), 0.01)) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: More than 5% of Rahsu requests are failing
      - alert: RahsuSlowHttpResponses
        expr: |
          histogram_quantile(0.95, sum(rate(rahsu_http_duration_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Rahsu p95 response time greater than 2 seconds
