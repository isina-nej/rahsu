name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev
      - run: uv sync --extra dev
      - run: uv run --extra dev ruff check --select E4,E9,F63,F7,F82 backend tests
      - run: uv run --extra dev pytest -q
  frontend:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run build
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
